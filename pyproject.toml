[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsearcher"
version = "0.1.0"
description = "Local Tavily-compatible search & extract API"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "peakQuick" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "ddgs>=9.0",
  "curl_cffi>=0.10",
  "trafilatura>=2.0",
  "patchright>=1.50",
  "onnxruntime>=1.20",
  "sentencepiece>=0.2",
  "numpy>=2.0",
  "huggingface-hub>=0.25",
  "mcp>=2.0",
  "pypdfium2>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "tavily-python>=0.7", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
agentsearcher = "agentsearcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["live: hits the real internet (deselect with -m 'not live')"]

[tool.pyright]
venvPath = "."
venv = ".venv"
